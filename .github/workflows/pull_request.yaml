name: pull-request

on:
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read

jobs:
  release:
    name: build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to write releases
      packages: write # needed for ghcr access
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare
        id: prep
        run: |
          VERSION=sha-${GITHUB_SHA::8}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF/refs\/tags\//}
          fi
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "REVISION=${GITHUB_SHA}" >> $GITHUB_OUTPUT
      - name: Build
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          tags: |
            ghcr.io/intruder-io/${{ env.IMAGE_NAME }}:${{ steps.prep.outputs.VERSION }}

  extension:
    name: check Claude Desktop extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and pack
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . intruder.mcpb
      # The manifest's tool list is shown on the install screen, so it must match the server's tools.
      - name: Check manifest tools match the server
        run: |
          timeout 120 uv run --locked python - <<'PY'
          import asyncio, json, os, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def server_tools():
              params = StdioServerParameters(command=".venv/bin/intruder-mcp", env={**os.environ, "INTRUDER_API_KEY": "dummy"})
              async with stdio_client(params) as streams, ClientSession(*streams) as session:
                  await session.initialize()
                  return {tool.name for tool in (await session.list_tools()).tools}

          server = asyncio.run(server_tools())
          manifest = {tool["name"] for tool in json.load(open("manifest.json"))["tools"]}
          if not server:
              sys.exit("The server returned no tools")
          if server != manifest:
              sys.exit(f"Missing from manifest.json: {sorted(server - manifest)}\nNot in server: {sorted(manifest - server)}")
          print(f"{len(server)} tools match")
          PY
