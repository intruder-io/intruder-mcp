[project]
name = "intruder-mcp"
version = "0.1.6"
description = "MCP server for Intruder API"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0,<2",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
]

[project.scripts]
intruder-mcp = "intruder_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intruder_mcp"] 
